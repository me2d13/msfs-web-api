<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MSFS Web API - local page test</title>
    <style>
        body { font-family: system-ui, "Segoe UI", Arial, sans-serif; margin: 1.5em auto; max-width: 46em; padding: 0 1em; line-height: 1.45; }
        h1 { font-size: 1.3em; }
        h2 { font-size: 1.05em; margin-top: 1.4em; }
        label { display: inline-block; margin: 0.2em 0.6em 0.2em 0; }
        input[type=text], input[type=number], textarea { padding: 0.2em 0.4em; }
        input[type=text] { width: 24em; }
        textarea { width: 100%; font-family: ui-monospace, Consolas, monospace; }
        button { padding: 0.25em 0.8em; }
        .out { white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; background: #8882; border-radius: 4px; padding: 0.5em 0.7em; min-height: 1.4em; }
        .muted { color: #8888; font-size: 0.9em; }
        code { font-family: ui-monospace, Consolas, monospace; }
    </style>
</head>
<body>
    <h1>MSFS Web API - local page test</h1>
    <p class="muted">
        Served from the <code>www</code> directory next to the exe. Requests go to <span id="origin" class="mono"></span>,
        so the same page works over the network. The API status page is at <a href="/">/</a>.
    </p>

    <h2>Read a variable</h2>
    <label>Variable <input type="text" id="var" value="PLANE ALTITUDE|ALT"></label>
    <label>every <input type="number" id="interval" value="0" style="width:5em"> ms (0 = once)</label>
    <button id="getBtn">Get</button>
    <div class="out" id="getOut">no request yet</div>

    <h2>Write a variable</h2>
    <label>Variable <input type="text" id="setVar" value="L:VC_AT_ARM_LIGHT_VAL"></label>
    <label>value <input type="number" id="setValue" value="1" step="any" style="width:6em"></label>
    <button id="setBtn">Set</button>
    <div class="out" id="setOut">no request yet</div>

    <h2>Read several at once</h2>
    <textarea id="multi" rows="4">PLANE ALTITUDE|ALT
AIRSPEED INDICATED|IAS
CLIENT:PMDG_NG3_Data:0x1B5:bool|AT_ARM</textarea>
    <button id="multiBtn">Get multiple</button>
    <div class="out" id="multiOut">no request yet</div>

    <script>
        const base = location.origin;
        document.getElementById('origin').textContent = base;

        const show = (id, text) => { document.getElementById(id).textContent = text; };
        let timer = null;

        async function post(path, body, outId) {
            try {
                const response = await fetch(base + path, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const text = await response.text();
                show(outId, response.status + ' ' + (text || '(empty body)'));
            } catch (e) {
                show(outId, 'request failed: ' + e.message);
            }
        }

        async function get() {
            const reference = { simVarName: document.getElementById('var').value };
            await post('/api/simvar/get', reference, 'getOut');
        }

        document.getElementById('getBtn').addEventListener('click', () => {
            if (timer) { clearInterval(timer); timer = null; }
            get();
            const interval = Number(document.getElementById('interval').value) || 0;
            if (interval > 0) timer = setInterval(get, interval);
        });

        document.getElementById('setBtn').addEventListener('click', () => post('/api/simvar/set', {
            simVarName: document.getElementById('setVar').value,
            value: Number(document.getElementById('setValue').value)
        }, 'setOut'));

        document.getElementById('multiBtn').addEventListener('click', () => {
            const references = document.getElementById('multi').value
                .split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0)
                .map(line => ({ simVarName: line }));
            post('/api/simvar/getMultiple', references, 'multiOut');
        });
    </script>
</body>
</html>
