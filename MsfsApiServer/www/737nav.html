<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>737 Radio - MSFS web API</title>
<style>
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: #141518;
    color: #d9dee7;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    min-height: 100vh;
    padding: 64px 16px 16px;
    overflow: auto;
  }
  .stage { flex: 0 0 auto; position: relative; margin: auto; }
  .panel {
    width: min(660px, var(--avail-w, 628px));
    transform: scale(var(--panel-zoom, 1));
    transform-origin: top left;
    background: linear-gradient(180deg, #43464a 0%, #323437 55%, #2a2c2f 100%);
    border: 1px solid #55585c;
    border-radius: 18px;
    box-shadow: 0 18px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
    padding: 16px 18px 18px;
    position: relative;
  }
  .zoom-ui {
    position: fixed;
    top: 12px; left: 12px;
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 3px;
    background: rgba(32, 34, 37, .92);
    border: 1px solid #4c4f54;
    border-radius: 999px;
    box-shadow: 0 4px 14px rgba(0,0,0,.45);
    user-select: none;
  }
  .zoom-ui button {
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    line-height: 1;
    color: #cfd7e3;
    background: transparent;
    border: 0;
    border-radius: 999px;
    min-width: 32px;
    height: 30px;
    cursor: pointer;
  }
  .zoom-ui button:hover { background: #3a3d42; color: #fff; }
  .zoom-ui button:disabled { opacity: .35; cursor: default; }
  .zoom-ui button:disabled:hover { background: transparent; }
  .zoom-ui .zoom-value { min-width: 52px; font-size: 12px; font-weight: 600; letter-spacing: .04em; color: #9fb4d6; }
  .zoom-ui .zoom-value:hover { color: #dbe8ff; }
  .panel::before, .panel::after {
    content: '';
    position: absolute;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #6b6e72, #26282a 70%);
    box-shadow: inset 0 0 3px #000;
    top: 10px;
  }
  .panel::before { left: 10px; }
  .panel::after  { right: 10px; }

  .topbar { display: flex; align-items: center; gap: 8px; padding: 2px 12px 12px; }
  .mode-btn {
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .08em;
    color: #b9c2cf;
    background: #232528;
    border: 1px solid #4c4f54;
    border-radius: 999px;
    padding: 7px 16px;
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .mode-btn:hover { background: #2e3134; color: #e7ecf5; }
  .mode-btn.active { background: #dfe6f0; color: #141518; border-color: #dfe6f0; }
  .conn {
    margin-left: auto;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .08em;
    color: #8a93a1;
    display: flex;
    align-items: center;
    gap: 6px;
    text-transform: uppercase;
  }
  .conn .dot { width: 8px; height: 8px; border-radius: 50%; background: #a33; box-shadow: 0 0 6px rgba(220,60,60,.5); }
  .conn.live .dot { background: #3fbf6f; box-shadow: 0 0 6px rgba(63,191,111,.7); }
  .conn.live { color: #79c99a; }

  .body { display: grid; grid-template-columns: 76px 1fr 214px; gap: 16px; align-items: center; }
  .swap-col { display: flex; justify-content: center; }
  .swap-btn {
    font: inherit;
    width: 70px;
    height: 150px;
    border-radius: 12px;
    background: linear-gradient(180deg, #2e3033, #1e2022);
    border: 1px solid #52555a;
    box-shadow: 0 3px 0 #111, inset 0 1px 0 rgba(255,255,255,.07);
    color: #cfd7e3;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .1em;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 4px;
  }
  .swap-btn .arrow { font-size: 22px; line-height: 1; color: #eaf1ff; }
  .swap-btn:hover { background: linear-gradient(180deg, #383b3f, #25272a); }
  .swap-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #111; }
  .swap-btn:disabled { opacity: .45; cursor: default; }

  .display {
    background: #070b1c;
    border: 2px solid #0c0e12;
    border-radius: 10px;
    padding: 10px 16px;
    box-shadow: inset 0 0 26px rgba(40,90,220,.45), inset 0 0 4px #000;
    min-width: 0;
  }
  .line { display: flex; align-items: baseline; gap: 14px; padding: 7px 2px; min-height: 62px; }
  .line + .line { border-top: 1px solid rgba(120,150,255,.18); }
  .tag {
    flex: 0 0 52px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .12em;
    color: #7fa8ff;
    text-shadow: 0 0 8px rgba(90,140,255,.55);
    text-transform: uppercase;
  }
  .freq {
    font-size: 46px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: .02em;
    color: #dbe8ff;
    text-shadow: 0 0 14px rgba(110,160,255,.6);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .line.editing .freq { color: #ffffff; }
  .line.error .freq { color: #ff7b7b; text-shadow: 0 0 14px rgba(255,60,60,.6); }
  .line.error .tag { color: #ff7b7b; }
  .cursor {
    display: inline-block;
    width: 3px;
    height: .82em;
    margin-left: 4px;
    background: #cfe0ff;
    vertical-align: -0.04em;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; justify-items: center; }
  .keypad.busy { pointer-events: none; opacity: .6; }
  .key {
    font: inherit;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 30%, #3a3d41, #191a1c 78%);
    border: 1px solid #55585d;
    box-shadow: 0 3px 0 #0d0e10, inset 0 1px 0 rgba(255,255,255,.08);
    color: #e8edf5;
    font-size: 21px;
    font-weight: 600;
    cursor: pointer;
    transition: background .1s, transform .05s;
    user-select: none;
  }
  .key:hover { background: radial-gradient(circle at 38% 30%, #474a4f, #232527 78%); }
  .key:active { transform: translateY(2px); box-shadow: 0 1px 0 #0d0e10; }
  .key.clear { font-size: 13px; font-weight: 700; letter-spacing: .08em; }
  .key.blank { visibility: hidden; }

  .msg { min-height: 20px; margin-top: 12px; text-align: center; font-size: 13px; letter-spacing: .03em; color: #8de0a8; transition: color .2s; }
  .msg.bad { color: #ff8c8c; }
  .msg:empty { visibility: hidden; }

  @media (max-width: 640px) {
    body { padding: 56px 8px 8px; }
    .panel { padding: 12px; }
    .body { grid-template-columns: 58px 1fr; grid-template-areas: 'swap display' 'keypad keypad'; }
    .swap-col { grid-area: swap; }
    .swap-btn { width: 54px; height: 128px; font-size: 10px; }
    .display { grid-area: display; }
    .keypad { grid-area: keypad; margin: 8px auto 0; width: 208px; max-width: 100%; }
    .freq { font-size: 34px; }
    .tag { flex-basis: 44px; font-size: 13px; }
    .key { width: 52px; height: 52px; }
  }

</style>
</head>
<body>
<div class="zoom-ui" role="group" aria-label="Panel zoom">
  <button id="zoomOut" type="button" title="Zoom out">&#8722;</button>
  <button id="zoomValue" class="zoom-value" type="button" title="Reset to 100%">100%</button>
  <button id="zoomIn" type="button" title="Zoom in">+</button>
</div>

<div class="stage" id="stage">
<div class="panel">
  <div class="topbar">
    <button class="mode-btn" data-mode="com1">COM1</button>
    <button class="mode-btn active" data-mode="nav1">NAV1</button>
    <button class="mode-btn" data-mode="nav2">NAV2</button>
    <div class="conn" id="conn"><span class="dot"></span><span id="connText">offline</span></div>
  </div>

  <div class="body">
    <div class="swap-col">
      <button class="swap-btn" id="swapBtn" title="Swap active and standby">
        <span>ACT</span>
        <span class="arrow">&#8645;</span>
        <span>STBY</span>
      </button>
    </div>

    <div class="display">
      <div class="line" id="actLine">
        <span class="tag" id="actTag">VOR</span>
        <span class="freq" id="actFreq">---.--</span>
      </div>
      <div class="line" id="stbyLine">
        <span class="tag" id="stbyTag">VOR</span>
        <span class="freq" id="stbyFreq">---.--</span>
      </div>
    </div>

    <div class="keypad" id="keypad">
      <button class="key" data-key="1">1</button>
      <button class="key" data-key="2">2</button>
      <button class="key" data-key="3">3</button>
      <button class="key" data-key="4">4</button>
      <button class="key" data-key="5">5</button>
      <button class="key" data-key="6">6</button>
      <button class="key" data-key="7">7</button>
      <button class="key" data-key="8">8</button>
      <button class="key" data-key="9">9</button>
      <button class="key blank"></button>
      <button class="key" data-key="0">0</button>
      <button class="key clear" data-key="CLR">CLR</button>
    </div>
  </div>

  <div class="msg" id="msg"></div>
</div>
</div>

<script>
(() => {
  'use strict';

  const API = location.origin;

  /* What MSFS is asked for and what it is told to do.
     - Everything in the sim comes back in hertz; the numbers here are hertz.
     - MSFS does not let you write the COM/NAV simvars, so the page only ever
       reads them and changes them with the radio key events.
     - Add-ons that keep their own radio state (PMDG, Fenix, iniBuilds) may not
       follow the stock simvars or the stock swap event. If a button does not
       move the real RMP, edit the simvar names or event names below - the page
       is deliberately only a thin layer over the API.
     - The keypad writes standby, like the real RMP. The `active` event is listed
       but unused; keep it there if you ever want the keypad to set active
       directly. */
  const RADIOS = {
    com1: {
      tag: 'COM',
      band: [118000000, 137000000],
      active: { var: 'COM ACTIVE FREQUENCY:1', alias: 'COM1A' },
      standby: { var: 'COM STANDBY FREQUENCY:1', alias: 'COM1S' },
      events: { standby: 'COM_STBY_RADIO_SET_HZ', active: 'COM_RADIO_SET_HZ', swap: 'COM1_RADIO_SWAP' },
      digits: 6,
      placeholder: '---.---',
      parse: d => parseInt(d, 10) * 1000,
      format: v => (v / 1000000).toFixed(3),
      preview: d => d.slice(0, 3) + (d.length > 3 ? '.' + d.slice(3) : ''),
      valid: v => v >= 118000000 && v <= 136975000 && v % 5000 === 0,
      describe: () => 'COM'
    },
    nav1: {
      tag: 'NAV1',
      band: [108000000, 118000000],
      active: { var: 'NAV ACTIVE FREQUENCY:1', alias: 'NAV1A' },
      standby: { var: 'NAV STANDBY FREQUENCY:1', alias: 'NAV1S' },
      events: { standby: 'NAV1_STBY_SET_HZ', active: 'NAV1_RADIO_SET_HZ', swap: 'NAV1_RADIO_SWAP' },
      digits: 5,
      placeholder: '---.--',
      parse: d => parseInt(d, 10) * 10000,
      format: v => (v / 1000000).toFixed(2),
      preview: d => d.slice(0, 3) + (d.length > 3 ? '.' + d.slice(3) : ''),
      valid: v => v >= 108000000 && v <= 117950000 && v % 50000 === 0,
      describe: navLabel
    },
    nav2: {
      tag: 'NAV2',
      band: [108000000, 118000000],
      active: { var: 'NAV ACTIVE FREQUENCY:2', alias: 'NAV2A' },
      standby: { var: 'NAV STANDBY FREQUENCY:2', alias: 'NAV2S' },
      events: { standby: 'NAV2_STBY_SET_HZ', active: 'NAV2_RADIO_SET_HZ', swap: 'NAV2_RADIO_SWAP' },
      digits: 5,
      placeholder: '---.--',
      parse: d => parseInt(d, 10) * 10000,
      format: v => (v / 1000000).toFixed(2),
      preview: d => d.slice(0, 3) + (d.length > 3 ? '.' + d.slice(3) : ''),
      valid: v => v >= 108000000 && v <= 117950000 && v % 50000 === 0,
      describe: navLabel
    }
  };

  const WATCH = [];
  for (const r of Object.values(RADIOS)) {
    WATCH.push({ name: r.active.var, alias: r.active.alias, band: r.band });
    WATCH.push({ name: r.standby.var, alias: r.standby.alias, band: r.band });
  }

  /* SimConnect hands a frequency back in whatever unit the sim keeps it in
     (MHz, kHz, hertz, a BCD16 count). Pick the one that lands in the band. */
  function toHz(value, band) {
    if (typeof value !== 'number' || !isFinite(value)) return null;
    for (const scale of [1, 1000, 10000, 1000000]) {
      const hz = Math.round(value * scale);
      if (hz >= band[0] && hz <= band[1]) return hz;
    }
    return null;
  }

  /* VOR/ILS label from the frequency, same split as the real band:
     108.00-111.95 carries ILS on alternating 50 kHz channel pairs. */
  function navLabel(v) {
    if (typeof v !== 'number') return '';
    const mhz = v / 1000000;
    if (mhz < 108 || mhz >= 112) return 'VOR';
    const channel = Math.round((mhz - 108) * 20);
    return (channel % 4 === 2 || channel % 4 === 3) ? 'ILS' : 'VOR';
  }

  const els = {
    actFreq: document.getElementById('actFreq'),
    actTag: document.getElementById('actTag'),
    stbyFreq: document.getElementById('stbyFreq'),
    stbyTag: document.getElementById('stbyTag'),
    stbyLine: document.getElementById('stbyLine'),
    msg: document.getElementById('msg'),
    conn: document.getElementById('conn'),
    connText: document.getElementById('connText'),
    swapBtn: document.getElementById('swapBtn'),
    keypad: document.getElementById('keypad'),
    zoomOut: document.getElementById('zoomOut'),
    zoomIn: document.getElementById('zoomIn'),
    zoomValue: document.getElementById('zoomValue'),
    stage: document.getElementById('stage'),
    panel: document.querySelector('.panel')
  };

  /* panel zoom, persisted per browser */
  const ZOOM_KEY = 'msfsapi.737nav.zoom';
  const ZOOM_MIN = 60;
  const ZOOM_MAX = 200;
  const ZOOM_STEP = 10;

  let zoom = 100;

  function clampZoom(v) {
    return Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, Math.round(v / ZOOM_STEP) * ZOOM_STEP));
  }

  function loadZoom() {
    try {
      const v = parseInt(localStorage.getItem(ZOOM_KEY), 10);
      return Number.isFinite(v) ? v : 100;
    } catch (e) {
      return 100;
    }
  }

  function applyZoom(next, save) {
    zoom = clampZoom(next);
    document.documentElement.style.setProperty('--panel-zoom', String(zoom / 100));
    els.zoomValue.textContent = zoom + '%';
    els.zoomOut.disabled = zoom <= ZOOM_MIN;
    els.zoomIn.disabled = zoom >= ZOOM_MAX;
    updateStage();
    if (save) {
      try { localStorage.setItem(ZOOM_KEY, String(zoom)); } catch (e) {}
    }
  }

  /* Reserve the scaled panel's footprint so centering and scrollbars stay correct. */
  function updateStage() {
    const root = document.documentElement;
    const pad = root.clientWidth <= 640 ? 16 : 32;
    root.style.setProperty('--avail-w', Math.max(280, root.clientWidth - pad) + 'px');
    if (!els.stage || !els.panel) return;
    const z = zoom / 100;
    els.stage.style.width = (els.panel.offsetWidth * z) + 'px';
    els.stage.style.height = (els.panel.offsetHeight * z) + 'px';
  }

  const values = {};
  let mode = 'nav1';
  let buffer = '';
  let busy = false;
  let ws = null;
  let reconnectTimer = null;
  let msgTimer = null;

  const cfg = () => RADIOS[mode];

  function setMsg(text, bad) {
    els.msg.textContent = text || '';
    els.msg.classList.toggle('bad', !!bad);
    clearTimeout(msgTimer);
    if (text) msgTimer = setTimeout(() => { els.msg.textContent = ''; }, 2600);
  }

  function setLive(live) {
    els.conn.classList.toggle('live', live);
    els.connText.textContent = live ? 'live' : 'offline';
  }

  function render() {
    const c = cfg();
    const a = values[c.active.alias];
    const s = values[c.standby.alias];

    els.actFreq.textContent = typeof a === 'number' ? c.format(a) : c.placeholder;
    els.actTag.textContent = typeof a === 'number' ? c.describe(a) : c.tag;

    const editing = buffer.length > 0;
    els.stbyLine.classList.toggle('editing', editing);

    if (editing) {
      els.stbyFreq.textContent = c.preview(buffer);
      const caret = document.createElement('span');
      caret.className = 'cursor';
      els.stbyFreq.appendChild(caret);
      const pv = buffer.length === c.digits ? c.parse(buffer) : NaN;
      els.stbyTag.textContent = c.valid(pv) ? c.describe(pv) : c.tag;
    } else {
      els.stbyFreq.textContent = typeof s === 'number' ? c.format(s) : c.placeholder;
      els.stbyTag.textContent = typeof s === 'number' ? c.describe(s) : c.tag;
    }

    els.swapBtn.disabled = busy || !c.events.swap;
  }

  function clearError() {
    els.stbyLine.classList.remove('error');
  }

  function showError(text) {
    els.stbyLine.classList.add('error');
    setMsg(text, true);
    clearTimeout(showError._t);
    showError._t = setTimeout(clearError, 1800);
  }

  async function event(name, value) {
    const res = await fetch(API + '/api/event/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, value: value })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
  }

  /* MSFS keeps the standby in the sim, not in the page, so the value the page
     just asked for is confirmed by the stream a second later. */
  async function commit(hz) {
    const c = cfg();
    busy = true;
    els.keypad.classList.add('busy');
    try {
      await event(c.events.standby, hz);
      buffer = '';
      setMsg('Standby set to ' + c.format(hz));
    } catch (err) {
      showError('Could not set standby: ' + err.message);
    } finally {
      busy = false;
      render();
    }
  }

  function press(key) {
    if (busy) return;
    const c = cfg();

    if (key === 'CLR') {
      buffer = buffer.slice(0, -1);
      clearError();
      render();
      return;
    }

    if (buffer.length >= c.digits) return;
    buffer += key;
    clearError();
    render();

    if (buffer.length === c.digits) {
      const hz = c.parse(buffer);
      if (c.valid(hz)) {
        commit(hz);
      } else {
        showError('Invalid frequency: ' + c.preview(buffer) + (mode.startsWith('com') ? ' (5 kHz increments)' : ' (50 kHz steps)'));
      }
    }
  }

  async function swap() {
    const c = cfg();
    if (!c.events.swap) return;

    busy = true;
    render();
    try {
      await event(c.events.swap, 1);
      buffer = '';
      setMsg('Swapped active and standby');
    } catch (err) {
      showError('Swap failed: ' + err.message);
    } finally {
      busy = false;
      render();
    }
  }

  function setMode(next) {
    if (!RADIOS[next] || next === mode) return;
    mode = next;
    buffer = '';
    clearError();
    document.querySelectorAll('.mode-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === mode);
    });
    setMsg('');
    render();
  }

  function connect() {
    clearTimeout(reconnectTimer);
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    try {
      ws = new WebSocket(proto + '://' + location.host + '/api/simvar/register?interval=1');
    } catch (err) {
      scheduleReconnect();
      return;
    }

    ws.onopen = () => {
      setLive(true);
      ws.send(JSON.stringify(WATCH.map(w => ({ simVarName: w.name + '|' + w.alias }))));
    };

    ws.onmessage = ev => {
      let data;
      try { data = JSON.parse(ev.data); } catch (e) { return; }
      if (!data || typeof data !== 'object' || Array.isArray(data)) return;
      let changed = false;
      for (const w of WATCH) {
        const hz = toHz(data[w.alias], w.band);
        if (hz !== null && values[w.alias] !== hz) {
          values[w.alias] = hz;
          changed = true;
        }
      }
      if (changed) render();
    };

    ws.onclose = () => {
      setLive(false);
      scheduleReconnect();
    };

    ws.onerror = () => {
      try { ws.close(); } catch (e) {}
    };
  }

  function scheduleReconnect() {
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connect, 2000);
  }

  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => setMode(btn.dataset.mode));
  });

  els.keypad.addEventListener('click', ev => {
    const btn = ev.target.closest('.key');
    if (!btn || !btn.dataset.key) return;
    press(btn.dataset.key);
  });

  els.swapBtn.addEventListener('click', swap);

  els.zoomOut.addEventListener('click', () => applyZoom(zoom - ZOOM_STEP, true));
  els.zoomIn.addEventListener('click', () => applyZoom(zoom + ZOOM_STEP, true));
  els.zoomValue.addEventListener('click', () => applyZoom(100, true));

  document.addEventListener('keydown', ev => {
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (ev.key >= '0' && ev.key <= '9') {
      ev.preventDefault();
      press(ev.key);
    } else if (ev.key === 'Backspace') {
      ev.preventDefault();
      press('CLR');
    } else if (ev.key === 'Escape') {
      ev.preventDefault();
      buffer = '';
      clearError();
      render();
    }
  });

  window.addEventListener('resize', updateStage);
  if (window.ResizeObserver) new ResizeObserver(updateStage).observe(els.panel);

  applyZoom(loadZoom(), false);
  render();
  connect();
})();
</script>
</body>
</html>
